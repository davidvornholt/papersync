apps:
  web:
    # Required with GOOGLE_VERTEX_PROJECT/LOCATION. Service-account JSON as one line; never sent to the browser.
    # Omit all three values to use a locally configured provider instead. No credential fallback.
    GOOGLE_VERTEX_CREDENTIALS_JSON: '{"type":"service_account","client_email":"papersync@example.iam.gserviceaccount.com","private_key":"replace-with-private-key"}'
    # Required session encryption key, at least 32 random characters. No default.
    BETTER_AUTH_SECRET: generate-a-long-random-session-secret
    # Required for a separate development GitHub OAuth app. No default.
    GITHUB_CLIENT_SECRET: replace-with-development-oauth-secret
    # Required PostgreSQL URI for the queue. Use the same dev database as packages.db.
    DATABASE_URL: postgresql://papersync:local-password@127.0.0.1:17435/papersync
packages:
  db:
    # Required for runtime queries and Drizzle migrations. Production uses a peer-authenticated Unix socket URI.
    DATABASE_URL: postgresql://papersync:local-password@127.0.0.1:17435/papersync
