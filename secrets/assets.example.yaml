assets:
  # Required by `bun standards screenshots publish`; no default.
  # Mint PaperSync's own 90-day, EU-bucket-scoped pair with:
  # bun standards creds add cloudflare --account 831f91724ea62b0cb0215829eb001f66 --dest assets:assets.screenshots_rw --bucket personal-pr-screenshots --jurisdiction eu --s3 --permissions "Workers R2 Storage Bucket Item Write"
  # Reconcile/renew with `bun standards creds plan` and `bun standards creds apply`.
  screenshots_rw:
    access_key_id: replace-with-r2-access-key-id
    secret_access_key: replace-with-r2-secret-access-key
