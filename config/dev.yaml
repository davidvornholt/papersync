apps:
  web:
    # Optional server-managed OCR. Set all three GOOGLE_VERTEX values to enable; partial configuration fails closed.
    # Gemini 3.8 Flash runs with high reasoning. Supported locations: global, eu, us. No fallback.
    # GOOGLE_VERTEX_PROJECT: your-gcp-project
    # GOOGLE_VERTEX_LOCATION: global
    # Required origin for GitHub OAuth redirects and cookies. Production is owned by personal-infra.
    BETTER_AUTH_URL: http://localhost:3000
    # Required public ID for a development GitHub OAuth app with localhost callback.
    GITHUB_CLIENT_ID: ""
    # Required GitHub numeric account ID admitted to this private instance.
    GITHUB_ALLOWED_ACCOUNT_ID: "157214705"
    # Optional device-flow client ID for a GitHub repository vault; unrelated to site login.
    NEXT_PUBLIC_GITHUB_CLIENT_ID: ""
    # Optional plugin ZIP location, relative to the web workspace. This is the runtime fallback too.
    PLUGIN_ARCHIVE_PATH: ../super-productivity-plugin/dist/papersync-plugin.zip
